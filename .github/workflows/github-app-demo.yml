name: Smart Tests Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
  SMART_TESTS_REPORT_ERROR: 1

jobs:
  example-jest-unit-tests:
    name: example-jest-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Smart Tests CLI
        run: pip install smart-tests-cli

      - name: Install dependencies
        run: npm ci

      - name: Subset unit tests
        run: |
          smart-tests verify
          npx vitest list --filesOnly > all-unit.txt
          echo "--- candidates ---"; cat all-unit.txt
          smart-tests subset --from-github-actions --target 50% vitest \
            < all-unit.txt > subset-unit.txt
          echo "--- selected ---"; cat subset-unit.txt

      - name: Run selected unit tests
        run: |
          if [ ! -s subset-unit.txt ]; then
            echo "Empty subset - nothing to run"; exit 0
          fi
          npx vitest run $(cat subset-unit.txt)

      - name: Store Test Results for Smart Tests
        if: always()
        uses: cloudbees-oss/smart-tests-results-upload-action@v1
        with:
          files: test-results/vitest-junit.xml

  example-playwright-e2e-tests:
    name: example-playwright-e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Smart Tests CLI
        run: pip install smart-tests-cli

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Subset e2e tests
        run: |
          smart-tests verify
          find e2e -maxdepth 1 -name '*.spec.ts' | sort > all-e2e.txt
          echo "--- candidates ---"; cat all-e2e.txt
          smart-tests subset --from-github-actions --target 50% playwright \
            < all-e2e.txt > subset-e2e.txt
          echo "--- selected ---"; cat subset-e2e.txt

      - name: Run selected e2e tests
        run: |
          if [ ! -s subset-e2e.txt ]; then
            echo "Empty subset - nothing to run"; exit 0
          fi
          npx playwright test $(cat subset-e2e.txt)

      - name: Store Test Results for Smart Tests
        if: always()
        uses: cloudbees-oss/smart-tests-results-upload-action@v1
        with:
          files: test-results/playwright-junit.xml
